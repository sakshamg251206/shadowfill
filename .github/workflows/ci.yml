name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - run: make install-locked
      - run: make lint

  python:
    name: python ${{ matrix.python }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 runs against the exact pins every committed result was produced
          # with. Newer interpreters resolve the loose ranges in pyproject.toml,
          # which is what a fresh `make install` gets, so drift in a dependency
          # shows up here before it shows up for a reader.
          - { python: "3.11", deps: locked }
          - { python: "3.12", deps: latest }
          - { python: "3.13", deps: latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - if: matrix.deps == 'locked'
        run: make install-locked
      - if: matrix.deps == 'latest'
        run: make install
      # SHADOWFILL_REQUIRE_CORE turns a missing extension module into a
      # collection error instead of a skip. The equivalence test guards itself
      # with importorskip, which is right for a pure-Python checkout and wrong
      # here: a wheel built without the engine would skip the only test that
      # validates it and the job would go green over an unvalidated engine.
      - run: pytest -v -m "not needs_lobster and not needs_itch"
        env:
          SHADOWFILL_REQUIRE_CORE: "1"

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-cpp

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - run: make install-locked
      # An absolute events/s gate assumes a machine, and a shared runner is
      # not one: the engine clears 2M/s on developer hardware and lands near
      # 1.4M/s here for no reason of its own. bench-ci instead times the
      # pure-Python reference engine on the same slice in the same run and
      # gates on the ratio, which is an order-of-magnitude check that no
      # runner speed can move. The absolute rate is still printed above it.
      # The strict absolute gate lives in `make bench`, run locally.
      - run: make bench-ci
