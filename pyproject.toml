[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "shadowfill"
version = "0.1.0"
description = "Counterfactual fill estimation from market-by-order data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
# Only needed to fetch Databento data. Kept out of the default install so CI,
# which never touches the network, does not pull it in.
data = ["databento>=0.34"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
]

[tool.scikit-build]
wheel.packages = ["python/shadowfill"]
cmake.version = ">=3.24"
build-dir = "build/{wheel_tag}"

# Gating on an explicit option rather than probing the filesystem means a path
# typo is a hard CMake error instead of a silently-skipped extension module.
# ON from Task 11, which is where src/shadowfill_bindings/module.cpp arrives
# and the wheel finally has an extension module worth compiling the core for.
[tool.scikit-build.cmake.define]
SHADOWFILL_BUILD_CORE = "ON"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers"
markers = ["needs_lobster: requires the manually downloaded LOBSTER sample"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Without this, ruff treats `shadowfill` as third-party and demands that the
# package imports be merged into the numpy/pandas block.
known-first-party = ["shadowfill"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python/shadowfill"]

# pyarrow ships neither stubs nor a py.typed marker. Scoped to that package
# rather than relaxing strict mode, per amendment G: the engine's own types
# stay fully checked, and shadowfill._core has a hand-written stub beside it.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# databento is an optional extra, deliberately absent from the default install
# so CI never pulls a data vendor it cannot use. Scoped per amendment G: the
# cost guard's own types stay fully checked, and its tests run against a fake
# client rather than the real package.
[[tool.mypy.overrides]]
module = ["databento.*"]
ignore_missing_imports = true
