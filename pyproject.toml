[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "shadowfill"
version = "0.1.0"
description = "Ground-truth fill outcomes for hypothetical passive orders, computed from market-by-order data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Saksham Garg" }]
keywords = [
    "market microstructure",
    "limit order book",
    "market-by-order",
    "backtesting",
    "survival analysis",
    "queue position",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.urls]
Repository = "https://github.com/sakshamg251206/shadowfill"

[project.optional-dependencies]
# Only needed to fetch Databento data. Kept out of the default install so CI,
# which never touches the network, does not pull it in.
data = ["databento>=0.34"]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
]

[tool.scikit-build]
wheel.packages = ["python/shadowfill"]
cmake.version = ">=3.24"
build-dir = "build/{wheel_tag}"

# Gating on an explicit option rather than probing the filesystem means a path
# typo is a hard CMake error instead of a silently-skipped extension module.
[tool.scikit-build.cmake.define]
SHADOWFILL_BUILD_CORE = "ON"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers"
markers = [
    "needs_lobster: requires the manually downloaded LOBSTER sample",
    "needs_itch: requires a Nasdaq ITCH sample fetched by scripts/fetch_itch_sample.sh",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Without this, ruff treats `shadowfill` as third-party and demands that the
# package imports be merged into the numpy/pandas block.
known-first-party = ["shadowfill"]

# No python_version pin: mypy checks against the interpreter it runs under. A
# pin to 3.11 made `make lint` fail on 3.12+ inside numpy's own stubs, which use
# `type` statements (amendment S); CI now runs the matrix it advertises.
[tool.mypy]
strict = true
files = ["python/shadowfill"]

# pyarrow ships neither stubs nor a py.typed marker. Scoped to that package
# rather than relaxing strict mode, per amendment G: the engine's own types
# stay fully checked, and shadowfill._core has a hand-written stub beside it.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# databento is an optional extra, deliberately absent from the default install
# so CI never pulls a data vendor it cannot use. Scoped per amendment G: the
# cost guard's own types stay fully checked, and its tests run against a fake
# client rather than the real package.
[[tool.mypy.overrides]]
module = ["databento.*"]
ignore_missing_imports = true
